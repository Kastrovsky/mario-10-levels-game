// ==================== 四、平台（含移动平台） ====================
class Platform {
  constructor(x, y, w, h, color, oneWay = false) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.color = color;
    this.oneWay = oneWay;      // true=单向：只托住上方落下的玩家，可从下方穿过
    this.moving = null;        // 移动平台配置；null = 静止
    this.t = 0;
    this.dir = 1;
    this.prevX = x;
    this.prevY = y;
  }
  update() {
    if (!this.moving) return;
    this.prevX = this.x;
    this.prevY = this.y;
    if (this.moving.mode === 'sine') {
      // 第 9 关“不规则轨迹”：x、y 两个方向都按不同相位做正弦摆动
      this.t += this.moving.speed;
      this.x = this.moving.mid + Math.sin(this.t) * this.moving.range;
      this.y = this.moving.y0 + Math.sin(this.t * 1.3 + 1.7) * this.moving.vAmp;
    } else {
      // 水平往复运动：碰到左右边界立即掉头
      this.x += this.dir * this.moving.speed;
      if (this.x <= this.moving.min) { this.x = this.moving.min; this.dir = 1; }
      if (this.x + this.w >= this.moving.max) { this.x = this.moving.max - this.w; this.dir = -1; }
    }
  }
  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    if (this.moving) {
      // 移动平台画两个小箭头提示运动方向
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      const ay = this.y + this.h / 2;
      const dx = this.dir;
      ctx.beginPath();
      ctx.moveTo(this.x + this.w / 2 - 14 * dx, ay - 4);
      ctx.lineTo(this.x + this.w / 2 - 2 * dx, ay);
      ctx.lineTo(this.x + this.w / 2 - 14 * dx, ay + 4);
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1;
      ctx.strokeRect(this.x + 0.5, this.y + 0.5, this.w - 1, this.h - 1);
    }
  }
}

// ==================== 五、敌人（蘑菇巡逻兵 / 飞行敌人 / Boss） ====================
class Enemy {
  constructor(cfg) {
    this.type = cfg.type || 'walker';
    this.w = cfg.w || 30;
    this.h = cfg.h || 24;
    this.x = cfg.x;
    // walker 的 y 由所在表面顶边推出（脚底贴地）；flyer 的 y 由 baseY + 正弦摆动
    this.y = this.type === 'flyer' ? cfg.baseY : cfg.groundY - this.h;
    this.baseY = this.y;
    this.min = cfg.min;
    this.max = cfg.max;
    this.speed = cfg.speed || 1.6;
    this.amp = cfg.amp || 0;
    this.phase = cfg.phase || Math.random() * 6.28;
    this.t = 0;
    this.dir = 1;
    this.hp = cfg.hp || 1;
    this.dead = false;
    this.boss = !!cfg.boss;
  }
  get centerY() { return this.y + this.h / 2; }

  update() {
    if (this.dead) return;
    this.t++;
    this.x += this.dir * this.speed;
    // 巡逻边界掉头：<= / >= 保证越界帧必被纠正
    if (this.x <= this.min) { this.x = this.min; this.dir = 1; }
    if (this.x + this.w >= this.max) { this.x = this.max - this.w; this.dir = -1; }
    if (this.type === 'flyer') {
      // 飞行敌人：水平巡逻同时做正弦上下浮动（phase 错开，轨迹不重复）
      this.y = this.baseY + Math.sin(this.t * 0.08 + this.phase) * this.amp;
    }
  }

  draw(ctx) {
    if (this.dead) return;
    const cx = this.x + this.w / 2;
    const baseY = this.y + this.h;
    if (this.type === 'flyer') {
      // 紫色飞行敌人：椭圆身体 + 扇动翅膀
      const flap = Math.sin(this.t * 0.3) * 4;
      ctx.fillStyle = '#8e24aa';
      ctx.beginPath();
      ctx.ellipse(cx, this.y + this.h / 2, this.w / 2 - 2, this.h / 2 - 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#b06ab3';
      ctx.beginPath();
      ctx.moveTo(this.x + 2, this.y + this.h / 2 - 2);
      ctx.lineTo(this.x - 8, this.y + this.h / 2 - 8 - flap);
      ctx.lineTo(this.x + 6, this.y + this.h / 2 + 4);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(this.x + this.w - 2, this.y + this.h / 2 - 2);
      ctx.lineTo(this.x + this.w + 8, this.y + this.h / 2 - 8 - flap);
      ctx.lineTo(this.x + this.w - 6, this.y + this.h / 2 + 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx + (this.dir > 0 ? 2 : -4), this.y + this.h / 2 - 3, 2, 3);
    } else if (this.boss) {
      // Boss：尺寸翻倍的红色蘑菇，画血条
      ctx.fillStyle = '#fff3e0';
      ctx.fillRect(this.x + 10, baseY - 16, this.w - 20, 16);
      ctx.fillStyle = '#c62828';
      ctx.beginPath();
      ctx.arc(cx, baseY - 16, this.w / 2, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(this.x, baseY - 17, this.w, 3);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(cx - 14, baseY - 28, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 10, baseY - 34, 4, 0, Math.PI * 2); ctx.fill();
      // 眼睛
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 12, baseY - 42, 8, 6);
      ctx.fillRect(cx + 4, baseY - 42, 8, 6);
      ctx.fillStyle = '#000000';
      ctx.fillRect(cx - 10, baseY - 40, 3, 3);
      ctx.fillRect(cx + 6, baseY - 40, 3, 3);
      // 血条（3 格）
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < this.hp ? '#ff1744' : '#555';
        ctx.fillRect(this.x + 6 + i * 18, this.y - 10, 14, 5);
      }
    } else {
      // 普通红色蘑菇
      ctx.fillStyle = '#fff3e0';
      ctx.fillRect(this.x + 5, baseY - 8, this.w - 10, 8);
      ctx.fillStyle = '#d32f2f';
      ctx.beginPath();
      ctx.arc(cx, baseY - 8, this.w / 2, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(this.x, baseY - 9, this.w, 2);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(cx - 7, baseY - 15, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 6, baseY - 18, 2, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ==================== 六、玩家 ====================
class Player {
  constructor() {
    this.w = PLAYER_W;
    this.h = PLAYER_H;
    this.vx = 0;
    this.vy = 0;
    this.onGround = false;
    this.crouching = false;
    this.invincibleTimer = 0;
    this.facing = 1;
    this.prevBottom = 0;
    this.prevTop = 0;
  }
  get bottom() { return this.y + this.h; }
  get top() { return this.y; }

  respawn(level) {
    this.x = level.spawnX;
    this.y = spawnYFor(level, level.spawnX);
    this.vx = 0;
    this.vy = 0;
    this.onGround = false;
    this.crouching = false;
    this.h = PLAYER_H;
    this.invincibleTimer = INVINCIBLE_TIME; // 重生后 1.5 秒无敌
  }

  // 下蹲：高度缩为 60%，脚底保持不动；恢复原高前检查头顶是否被实心平台挡住
  setCrouching(crouching) {
    if (this.crouching === crouching) return;
    const newH = crouching ? Math.round(PLAYER_H * CROUCH_H_FACTOR) : PLAYER_H;
    if (!crouching) {
      const oldH = this.h;
      const newY = this.y - (newH - oldH);
      let blocked = false;
      for (const p of platforms) {
        if (p.oneWay) continue; // 单向砖块不阻挡抬头
        // 恢复后的碰撞箱若与实心平台重叠则保持下蹲（隧道内不可站起）
        if (this.x < p.x + p.w && this.x + this.w > p.x &&
            newY < p.y + p.h && newY + newH > p.y) { blocked = true; break; }
      }
      if (blocked) return;
    }
    this.crouching = crouching;
    if (crouching) {
      const oldH = this.h;
      this.h = newH;
      this.y += oldH - this.h; // 脚底锚定：y 下移
    } else {
      const oldH = this.h;
      this.h = newH;
      this.y -= this.h - oldH; // 恢复原高：y 上移
    }
  }

  update(dt, enemies, spikes) {
    if (this.invincibleTimer > 0) {
      this.invincibleTimer = Math.max(0, this.invincibleTimer - dt);
    }
    this.setCrouching(keys.s);

    // —— 水平输入 ——
    let targetVx = 0;
    if (keys.a) targetVx -= MOVE_SPEED * (this.crouching ? CROUCH_SPEED_FACTOR : 1);
    if (keys.d) targetVx += MOVE_SPEED * (this.crouching ? CROUCH_SPEED_FACTOR : 1);
    if (targetVx !== 0) {
      // 按住方向键：每帧加速 ACCEL，实现“持续加速”而非瞬间满速
      this.vx += Math.sign(targetVx) * ACCEL;
      if (Math.abs(this.vx) > Math.abs(targetVx)) this.vx = targetVx;
      this.facing = Math.sign(targetVx);
    } else if (this.onGround) {
      // 地面摩擦：每帧保留 FRICTION 比例的速度，自然减速至停
      this.vx *= FRICTION;
      if (Math.abs(this.vx) < 0.05) this.vx = 0;
    }

    // —— 重力：数值来自当前关卡，逐关变化以改变跳跃手感 ——
    this.vy += G;
    if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED; // 限制下落速度防穿透

    // —— 分轴移动：先 X 后 Y ——
    this.prevBottom = this.bottom;
    this.prevTop = this.top;
    this.x += this.vx;
    this.checkCollision(true);
    this.y += this.vy;
    this.checkCollision(false);

    // —— 被移动平台携带（平台已在本帧先更新，delta 直接叠加给玩家）——
    for (const mp of movingPlatforms) {
      if (Math.abs(this.bottom - mp.y) < 1 &&
          this.x < mp.x + mp.w && this.x + this.w > mp.x) {
        this.x += mp.x - mp.prevX;
        this.y += mp.y - mp.prevY;
        this.onGround = true;
      }
    }

    // —— 敌人碰撞（严格伤害判定）——
    let gameOverReset = false;
    for (const enemy of enemies) {
      if (enemy.dead) continue;
      const overlapX = this.x < enemy.x + enemy.w && this.x + this.w > enemy.x;
      const overlapY = this.y < enemy.y + enemy.h && this.y + this.h > enemy.y;
      if (!(overlapX && overlapY)) continue;
      // 踩踏窗口：正在下落(vy>0) 且脚底落在 敌人中心点 到 其下方10px 之间
      const inStompWindow = this.bottom >= enemy.centerY && this.bottom <= enemy.centerY + 10;
      // 是否“正从敌人头顶上方落下”：上一帧脚底还在敌人中心点以上。
      // 为什么用中心点而非顶边+小容差：下落速度可达 6px/帧，小容差会在
      // 脚底穿过顶边后的第一帧就失效，导致“踩踏前的重叠”被误判为侧面碰撞
      const comingFromAbove = this.prevBottom <= enemy.centerY;
      if (this.vy > 0 && inStompWindow) {
        score += STOMP_SCORE;
        if (enemy.hp > 1) {
          // Boss：多段血量，踩中后弹起以便连续踩踏
          enemy.hp -= 1;
          this.vy = JUMP * 0.55;
          // 弹起上升阶段身体仍与 Boss 重叠，给 0.45 秒无敌防止上升途中被侧面碰撞误杀
          this.invincibleTimer = Math.max(this.invincibleTimer, 0.45);
        } else {
          enemy.dead = true; // 普通敌人一击消失
        }
      } else if (this.invincibleTimer <= 0 && !(this.vy > 0 && comingFromAbove)) {
        // 侧面碰撞：只有“不是正从上方落下”的接触才算死亡
        gameOverReset = this.die();
        break;
      }
    }

    // —— 尖刺：触碰即死（无视无敌）——
    if (!gameOverReset) {
      for (const s of spikes) {
        if (this.x < s.x + s.w && this.x + this.w > s.x &&
            this.y < s.y + s.h && this.y + this.h > s.y) {
          this.die();
          break;
        }
      }
    }

    // —— 掉落画布底部 ——
    if (!gameOverReset && this.y > FALL_DEATH_Y) {
      this.die();
    }
  }

  checkCollision(isHorizontal) {
    if (isHorizontal) {
      // —— 侧面碰撞：在全部重叠的实心障碍中，选取“位移最小”的修正目标 ——
      // 为什么取最小位移：走廊/管道并排时，两个障碍会同时挡住玩家，
      // 若按遍历顺序逐个弹回会把玩家来回推挤（如在管道与天花板之间抖动）；
      // 取最接近当前位置的弹回点可稳定停在入口处
      let bestX = null;
      for (const p of platforms) {
        if (p.oneWay) continue; // 单向砖块不挡侧面
        const overlapX = this.x < p.x + p.w && this.x + this.w > p.x;
        const overlapY = this.y < p.y + p.h && this.y + this.h > p.y;
        if (!(overlapX && overlapY)) continue;
        if (this.vx > 0) {
          const cand = p.x - this.w;
          if (bestX === null || cand > bestX) bestX = cand;
        } else if (this.vx < 0) {
          const cand = p.x + p.w;
          if (bestX === null || cand < bestX) bestX = cand;
        }
      }
      if (bestX !== null) {
        this.x = bestX; // 弹回障碍物边缘
        this.vx = 0;    // x 速度清零
      }
      return;
    }
    for (const p of platforms) {
      const overlapX = this.x < p.x + p.w && this.x + this.w > p.x;
      const overlapY = this.y < p.y + p.h && this.y + this.h > p.y;
      if (!(overlapX && overlapY)) continue;

      if (p.oneWay) {
        // 单向砖块：仅当下落且上一帧脚底未越过砖顶时托住（可穿下不可穿上）
        if (this.vy >= 0 && this.prevBottom <= p.y) {
          this.y = p.y - this.h; // 修正坐标，真正“站”在平台上
          this.vy = 0;
          this.onGround = true;
        }
      } else {
        // 实心平台：落地托住 / 顶头压回
        if (this.vy >= 0 && (this.prevBottom <= p.y || (this.prevTop < p.y && this.prevBottom < p.y + p.h))) {
          this.y = p.y - this.h;
          this.vy = 0;
          this.onGround = true;
        } else if (this.vy < 0 && this.prevTop >= p.y + p.h) {
          this.y = p.y + p.h;
          this.vy = 0;
        }
      }
    }
  }

  draw(ctx) {
    let alpha = 1;
    if (this.invincibleTimer > 0) {
      // 无敌闪烁：globalAlpha 交替变化
      alpha = (Math.floor(this.invincibleTimer * 10) % 2 === 0) ? 1 : 0.35;
    }
    ctx.globalAlpha = alpha;
    const feetY = this.y + this.h;
    const cx = this.x + this.w / 2;
    if (this.crouching) {
      ctx.fillStyle = '#e53935';
      ctx.fillRect(this.x + 2, feetY - 11, this.w - 4, 11);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx + (this.facing > 0 ? 1 : -4), feetY - 8, 3, 3);
    } else {
      ctx.fillStyle = '#e53935';
      ctx.fillRect(this.x + 5, feetY - 13, this.w - 10, 13);
      ctx.beginPath();
      ctx.arc(cx, feetY - 19, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#b71c1c';
      ctx.fillRect(this.x + 2, feetY - 24, this.w - 4, 5);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx + (this.facing > 0 ? 1 : -3), feetY - 21, 2, 3);
    }
    ctx.globalAlpha = 1;
  }

  // 死亡：生命减 1；耗尽则游戏结束，否则当前关卡起点重生
  die() {
    lives -= 1;
    if (lives <= 0) {
      state = 'gameOver';
      return true;
    }
    this.respawn(LEVELS[levelIndex]);
    return false;
  }
}

// ==================== 七、关卡构建 ====================
function spawnYFor(level, x) {
  for (const g of level.ground) {
    if (g.x <= x && x < g.x + g.w) return GROUND_Y - PLAYER_H; // 站在地面上
  }
  for (const p of level.platforms) {
    if (p.x <= x && x < p.x + p.w) return p.y - PLAYER_H;      // 站在平台上
  }
  return 300;
}

function loadLevel(idx) {
  levelIndex = idx;
  const L = LEVELS[idx];
  G = L.gravity;
  JUMP = L.jump;
  platforms = [];
  movingPlatforms = [];
  enemies = [];
  spikes = [];

  for (const g of L.ground) platforms.push(new Platform(g.x, GROUND_Y, g.w, GROUND_H, '#1e7d32', false));
  for (const p of L.pipes) platforms.push(new Platform(p.x, p.y, p.w, p.h, '#d32f2f', false));
  for (const c of L.ceilings) platforms.push(new Platform(c.x, c.y, c.w, c.h, '#8d6e63', false));
  for (const p of L.platforms) platforms.push(new Platform(p.x, p.y, p.w, p.h, '#e07b00', true));
  for (const m of L.moving) {
    const mp = new Platform(m.x, m.y, m.w, m.h, '#0097a7', true);
    if (m.mode === 'sine') {
      mp.moving = { mode: 'sine', mid: m.mid, range: m.range, y0: m.y, vAmp: m.vAmp, speed: m.speed };
    } else {
      mp.moving = { mode: 'linear', min: m.min, max: m.max, speed: m.speed };
    }
    mp.t = m.phase || 0;
    movingPlatforms.push(mp);
    platforms.push(mp);
  }
  for (const e of L.enemies) enemies.push(new Enemy(e));
  if (L.boss) enemies.push(new Enemy(Object.assign({ boss: true }, L.boss)));
  for (const s of L.spikes) spikes.push({ x: s.x, y: s.surfaceY - s.h, w: s.w, h: s.h, surfaceY: s.surfaceY });

  player = new Player();
  player.x = L.spawnX;
  player.y = spawnYFor(L, L.spawnX);
}

function startRun(idx) {
  lives = MAX_LIVES;
  score = 0;
  loadLevel(idx);
  state = 'playing';
}

// ==================== 八、游戏流程 ====================
function update(dt) {
  if (state === 'levelClear') {
    // 过关动画：1.5 秒后自动进入下一关
    clearTimer -= dt;
    if (clearTimer <= 0) {
      if (levelIndex >= LEVELS.length - 1) {
        state = 'allClear'; // 最终关通过：显示总分
      } else {
        loadLevel(levelIndex + 1);
        state = 'playing';
      }
    }
    return;
  }
  if (state !== 'playing') return;

  for (const mp of movingPlatforms) mp.update(); // 移动平台先动，玩家随后可被携带
  player.update(dt, enemies, spikes);
  for (const enemy of enemies) enemy.update();

  // —— 通关判定：x > 780 ——
  if (player.x > WIN_X) {
    score += CLEAR_SCORE; // 通关 +500
    unlocked = Math.max(unlocked, Math.min(levelIndex + 2, 10)); // 解锁下一关（上限 10）
    saveUnlock();
    clearTimer = 1.5;
    state = 'levelClear';
  }
}

// ==================== 九、渲染 ====================
const menuButtons = []; // 选关界面按钮（用于点击命中测试）

function drawSky(L) {
  const sky = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
  sky.addColorStop(0, L.bg[0]);
  sky.addColorStop(1, L.bg[1]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
}

function drawSpike(s) {
  // 灰色三角尖刺
  ctx.fillStyle = '#9e9e9e';
  ctx.beginPath();
  ctx.moveTo(s.x, s.y + s.h);
  ctx.lineTo(s.x + s.w / 2, s.y);
  ctx.lineTo(s.x + s.w, s.y + s.h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#616161';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function renderGame() {
  const L = LEVELS[levelIndex];
  drawSky(L);
  for (const p of platforms) p.draw(ctx);
  for (const s of spikes) drawSpike(s);
  for (const e of enemies) e.draw(ctx);
  player.draw(ctx);

  // —— HUD ——
  ctx.fillStyle = '#ffffff';
  ctx.font = '13px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`第 ${levelIndex + 1}/10 关 · ${L.name}`, 8, 16);
  ctx.font = '11px monospace';
  ctx.fillText(
    `FPS: ${fps}   x: ${Math.round(player.x)}   y: ${Math.round(player.y)}   velocityY: ${player.vy.toFixed(2)}`,
    8, 32
  );
  ctx.textAlign = 'right';
  ctx.font = '13px monospace';
  ctx.fillText(`得分: ${score}   生命: ${'♥'.repeat(Math.max(lives, 0))}`, CANVAS_W - 8, 16);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '11px monospace';
  ctx.fillText('W 跳跃   A/D 移动   S 下蹲   R 重开关卡', CANVAS_W / 2, CANVAS_H - 8);

  // —— 过关动画 ——
  if (state === 'levelClear') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#ffe082';
    ctx.font = '34px monospace';
    ctx.fillText(`第 ${levelIndex + 1} 关通过！`, CANVAS_W / 2, CANVAS_H / 2 - 8);
    ctx.fillStyle = '#ffffff';
    ctx.font = '15px monospace';
    ctx.fillText(`+${CLEAR_SCORE} 分`, CANVAS_W / 2, CANVAS_H / 2 + 24);
  }
}

function renderMenu() {
  drawSky(LEVELS[0]);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = '32px monospace';
  ctx.fillText('二维平面超级马里奥', CANVAS_W / 2, 58);
  ctx.font = '16px monospace';
  ctx.fillStyle = '#ffe082';
  ctx.fillText(`已解锁 ${unlocked}/10 关`, CANVAS_W / 2, 96);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '12px monospace';
  ctx.fillText('点击关卡开始（WASD 操控，共 5 条命）', CANVAS_W / 2, 126);

  menuButtons.length = 0;
  const bw = 130, bh = 78, gap = 20, y0 = 170;
  for (let i = 0; i < 10; i++) {
    const col = i % 5, row = Math.floor(i / 5);
    const bx = 40 + col * (bw + gap);
    const by = y0 + row * (bh + 26);
    menuButtons.push({ x: bx, y: by, w: bw, h: bh, idx: i });
    const locked = i >= unlocked;
    // 已解锁：橙色按钮；未解锁：深灰 + 锁
    ctx.fillStyle = locked ? '#3a3f4a' : (i === 0 ? '#ff9800' : '#e07b00');
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = locked ? '#555b66' : '#ffd180';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
    ctx.fillStyle = locked ? '#888' : '#ffffff';
    ctx.font = '26px monospace';
    ctx.fillText(String(i + 1), bx + bw / 2, by + 38);
    ctx.font = '11px monospace';
    ctx.fillText(LEVELS[i].name, bx + bw / 2, by + 58);
    if (locked) {
      // 锁图标
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bx + bw / 2, by + 18, 5, Math.PI, 0);
      ctx.stroke();
      ctx.fillRect(bx + bw / 2 - 8, by + 18, 16, 12);
      ctx.strokeStyle = '#666';
      ctx.strokeRect(bx + bw / 2 - 8, by + 18, 16, 12);
    } else {
      const stars = '★'.repeat(LEVELS[i].stars);
      ctx.fillStyle = '#fff3e0';
      ctx.font = '10px monospace';
      ctx.fillText(stars, bx + bw / 2, by + 72);
    }
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '12px monospace';
  ctx.fillText('W 跳跃  A/D 移动  S 下蹲  R 重开关卡', CANVAS_W / 2, CANVAS_H - 20);
}

function drawCenterPanel(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = '34px monospace';
  ctx.fillText(title, CANVAS_W / 2, 170);
  ctx.font = '16px monospace';
  ctx.fillStyle = '#ffe082';
  ctx.fillText(sub, CANVAS_W / 2, 210);
  // 返回选关按钮
  ctx.fillStyle = '#e07b00';
  ctx.fillRect(300, 250, 200, 46);
  ctx.strokeStyle = '#ffd180';
  ctx.strokeRect(301, 251, 198, 44);
  ctx.fillStyle = '#ffffff';
  ctx.font = '16px monospace';
  ctx.fillText('返回选关', CANVAS_W / 2, 280);
}

function render() {
  if (state === 'menu') { renderMenu(); return; }
  if (state === 'allClear') {
    drawSky(LEVELS[9]);
    drawCenterPanel('恭喜通关！', `最终得分：${score}   (解锁全部 10 关)`);
    return;
  }
  if (state === 'gameOver') {
    drawSky(LEVELS[levelIndex]);
    drawCenterPanel('游戏结束', `到达第 ${levelIndex + 1} 关 · 得分 ${score}`);
    return;
  }
  renderGame();
}

// ==================== 十、主循环（60FPS 节流 + 固定步长物理） ====================
let lastTime = 0;
let acc = 0;
let fps = 60;
let frameCount = 0;
let fpsTimer = 0;

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const elapsed = (ts - lastTime) / 1000;
  // 帧率节流：间隔不足 1/60 秒的冗余帧直接丢弃（不更新也不重绘）
  if (elapsed < STEP - 0.0005) return;
  lastTime = ts;
  acc += Math.min(elapsed, MAX_FRAME_DELTA);
  // 固定步长物理：每 1/60 秒补一次 update
  while (acc >= STEP) {
    update(STEP);
    acc -= STEP;
  }
  frameCount++;
  fpsTimer += elapsed;
  if (fpsTimer >= 0.5) {
    fps = Math.round(frameCount / fpsTimer);
    frameCount = 0;
    fpsTimer = 0;
  }
  render();
}

// ==================== 十一、输入（仅 WASD + R + 鼠标选关） ====================
window.addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'KeyW':
      // 仅在地面状态且为“新按下”时起跳，长按连发不会二段跳
      if (!keys.w && player && player.onGround && state === 'playing') {
        player.vy = JUMP;
        player.onGround = false;
      }
      keys.w = true;
      e.preventDefault();
      break;
    case 'KeyA':
      keys.a = true;
      e.preventDefault();
      break;
    case 'KeyS':
      keys.s = true;
      e.preventDefault();
      break;
    case 'KeyD':
      keys.d = true;
      e.preventDefault();
      break;
    case 'KeyR':
      // 重开关卡：保留分数与生命，从当前关起点重新开始
      if (state === 'playing' || state === 'levelClear') {
        loadLevel(levelIndex);
        state = 'playing';
      }
      e.preventDefault();
      break;
  }
});

window.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'KeyW': keys.w = false; e.preventDefault(); break;
    case 'KeyA': keys.a = false; e.preventDefault(); break;
    case 'KeyS': keys.s = false; e.preventDefault(); break;
    case 'KeyD': keys.d = false; e.preventDefault(); break;
    case 'KeyR': e.preventDefault(); break;
  }
});

window.addEventListener('blur', () => {
  keys.w = keys.a = keys.s = keys.d = false;
});

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  if (state === 'menu') {
    for (const b of menuButtons) {
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
        if (b.idx < unlocked) startRun(b.idx);
        break;
      }
    }
  } else if (state === 'allClear' || state === 'gameOver') {
    // “返回选关”按钮区域
    if (mx >= 300 && mx <= 500 && my >= 250 && my <= 296) {
      state = 'menu';
    }
  }
});

// 启动
requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
